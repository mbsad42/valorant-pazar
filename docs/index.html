<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valorant Pazarım</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,1 31,16 16,31 1,16' fill='%23ff4655'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1923; --panel: #1a2733; --panel2: #223343; --line: #2c3f52;
    --text: #ece8e1; --muted: #8b97a3; --accent: #ff4655; --accent2: #4ce0ff; --ok: #3ddc97;
    --disp: "Rajdhani", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  header { position: relative; padding: 22px 16px 14px; max-width: 1100px; margin: 0 auto; border-bottom: 1px solid var(--line); }
  header::before {
    content: ""; position: absolute; top: -60px; left: 16px; width: 260px; height: 180px;
    background: radial-gradient(closest-side, rgba(255,70,85,.16), transparent 70%); pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark {
    width: 24px; height: 24px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--accent), #ff8a94);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    box-shadow: 0 0 18px rgba(255,70,85,.55);
  }
  h1 { margin: 0; font: 700 24px/1 var(--disp); letter-spacing: 1px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  nav { display: flex; gap: 6px; margin-top: 16px; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid transparent;
    color: var(--muted); padding: 8px 15px; border-radius: 999px; font: 600 14.5px/1 var(--disp);
    letter-spacing: .3px; cursor: pointer; white-space: nowrap; transition: background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  nav button .ic { font-size: 13px; opacity: .9; }
  nav button:hover { color: var(--text); background: var(--panel); }
  nav button.on { color: #fff; background: var(--accent); box-shadow: 0 3px 14px rgba(255,70,85,.4); }

  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; }
  h2 { font: 600 13.5px/1 var(--disp); margin: 24px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; display: flex; align-items: center; gap: 8px; }
  h2:first-child { margin-top: 0; }
  h2::before { content: ""; width: 3px; height: 13px; background: var(--accent); border-radius: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .grid.small { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    position: relative; display: flex; flex-direction: column;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--tier, var(--line)) 60%, var(--line)); box-shadow: 0 10px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.02); }
  .card .img {
    height: 110px; display: grid; place-items: center; position: relative;
    background: radial-gradient(circle at 30% 20%, var(--panel2), var(--bg) 120%);
    border-bottom: 2px solid var(--tier, var(--line));
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
  }
  .small .card .img { height: 78px; }
  .card img { max-width: 92%; max-height: 92%; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .price { margin-top: auto; padding-top: 6px; font: 700 15px/1 var(--disp); color: var(--ok); letter-spacing: .3px; }
  .price s { color: var(--muted); font-weight: 400; font-family: system-ui, sans-serif; font-size: 13px; margin-right: 6px; }
  .tier { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--tier, var(--muted)); box-shadow: 0 0 6px var(--tier, transparent); }
  .star {
    position: absolute; top: 6px; right: 6px; z-index: 1; background: rgba(10,17,24,.7); backdrop-filter: blur(2px);
    border: 1px solid rgba(255,255,255,.08); color: var(--muted); border-radius: 50%; width: 30px; height: 30px;
    font-size: 16px; cursor: pointer; line-height: 1; transition: transform .12s ease, color .12s ease;
  }
  .star:hover { transform: scale(1.12); }
  .star.on { color: #ffd23f; }
  .hit { outline: 2px solid #ffd23f; box-shadow: 0 0 0 4px rgba(255,210,63,.15); }

  .banner {
    display: flex; align-items: center; gap: 10px; background: linear-gradient(90deg, rgba(255,210,63,.14), rgba(255,210,63,.04));
    border: 1px solid rgba(255,210,63,.5); color: #ffe08a; padding: 12px 14px; border-radius: 10px; margin-bottom: 16px;
  }
  .banner b { color: #fff; }

  .bundle {
    display: flex; gap: 16px; background: linear-gradient(135deg, var(--panel), var(--panel2)); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; flex-wrap: wrap; transition: border-color .16s ease;
  }
  .bundle:hover { border-color: var(--accent); }
  .bundle img { width: 120px; height: 170px; object-fit: cover; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,.4); }
  .bundle ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
  .bundle .name { font: 700 16px/1.2 var(--disp); letter-spacing: .3px; }

  .timer { color: var(--accent2); font: 700 14px/1 var(--disp); letter-spacing: .5px; font-variant-numeric: tabular-nums; }

  .day { margin-bottom: 22px; }
  .day h3 { margin: 0 0 8px; font: 600 14.5px/1 var(--disp); color: var(--text); letter-spacing: .3px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  input, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; font: inherit; transition: border-color .12s ease;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type=search] { flex: 1; min-width: 180px; }

  button.btn {
    background: var(--accent); color: #fff; border: 0; padding: 9px 18px; font: 600 14.5px/1 var(--disp);
    letter-spacing: .3px; cursor: pointer; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    transition: filter .12s ease, transform .1s ease;
  }
  button.btn:hover { filter: brightness(1.1); }
  button.btn:active { transform: scale(.97); }
  button.btn.ghost { background: var(--panel2); color: var(--text); }
  button.btn:disabled { opacity: .5; cursor: default; filter: none; }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 14px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 18px; }
  .box label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .box input { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 12.5px; }

  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(6px); background: var(--panel2);
    border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s ease, transform .2s ease;
    pointer-events: none; z-index: 5; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .sk-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .sk-card .img { height: 110px; }
  .sk-card .img, .sk-line {
    background: linear-gradient(90deg, var(--panel) 25%, var(--panel2) 37%, var(--panel) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
  }
  .sk-card .body { padding: 12px; }
  .sk-line { height: 10px; border-radius: 4px; margin: 8px 0; }
  .sk-line.w60 { width: 60%; }
  .sk-line.w40 { width: 40%; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span><h1>VALORANT <span>PAZARIM</span></h1></div>
  <div class="sub" id="sub">Yükleniyor…</div>
  <nav id="nav"></nav>
</header>
<main id="main">
  <div class="grid">
    <div class="sk-card"><div class="img"></div><div class="body"><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
    <div class="sk-card"><div class="img"></div><div class="body"><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
    <div class="sk-card"><div class="img"></div><div class="body"><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
    <div class="sk-card"><div class="img"></div><div class="body"><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TABS = [["today", "🛒", "Bugün"], ["history", "📜", "Geçmiş"], ["skins", "🗡️", "Tüm skinler"], ["wish", "⭐", "Bekleme listesi"]];
const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

let catalog, history = [], wishSaved = [], wish = new Set(), byAny = new Map();
let tab = "today", shown = 60, filters = { q: "", weapon: "", tier: "", onlyWish: false };
const ls = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

async function getJSON(path, fallback) {
  try {
    const r = await fetch(`${path}?t=${Date.now()}`);
    if (!r.ok) throw 0;
    return await r.json();
  } catch { return fallback; }
}

async function init() {
  [catalog, history, wishSaved] = await Promise.all([
    getJSON("data/skins.json", null), getJSON("data/history.json", []),
    getJSON("data/wishlist.json", { skins: [] }),
  ]);
  if (!catalog) { $("#main").innerHTML = '<div class="empty">skins.json bulunamadı. GitHub Actions bir kez çalışınca oluşur.</div>'; return; }
  wishSaved = wishSaved.skins || [];
  wish = new Set(wishSaved);
  for (const s of catalog.skins) { byAny.set(s.id, s); s.levels.forEach((l) => byAny.set(l, s)); }
  $("#sub").textContent = `${catalog.skins.length} skin · oyun sürümü ${catalog.game_version.replace("release-", "").split("-")[0]} · ${history.length} günlük geçmiş`;
  $("#nav").innerHTML = TABS.map(([k, ic, n]) => `<button data-t="${k}"><span class="ic">${ic}</span>${n}</button>`).join("");
  $("#nav").onclick = (e) => { const t = e.target.closest("button")?.dataset.t; if (t) go(t); };
  go("today");
  setInterval(tick, 1000);
}

function go(t) {
  tab = t;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  render();
}

function tierOf(s) { return s ? catalog.tiers[s.tier] : null; }
function tierColor(s) { const t = tierOf(s); return t ? "#" + t.color.slice(0, 6) : "#2c3f52"; }
function fmtDate(iso) { const d = new Date(iso + "T00:00:00Z"); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
function fmtDur(sec) {
  if (sec <= 0) return "bitti";
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
  return d ? `${d} gün ${h} sa` : `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function remaining(rec, ends) { return ends - (Date.now() - new Date(rec.fetched_at)) / 1000; }
function tick() {
  document.querySelectorAll("[data-end]").forEach((el) => { el.textContent = fmtDur((+el.dataset.end - Date.now()) / 1000); });
}
function endAttr(rec, sec) { return `data-end="${new Date(rec.fetched_at).getTime() + sec * 1000}"`; }

function card(s, { price, old, extra = "" } = {}, offerId) {
  if (!s) return `<div class="card"><div class="img">?</div><div class="body"><div class="name">Bilinmeyen skin</div><div class="meta">${esc((offerId || "").slice(0, 8))} · katalog güncellenince görünür</div></div></div>`;
  const t = tierOf(s);
  return `<div class="card ${wish.has(s.id) ? "hit" : ""}" style="--tier:${tierColor(s)}">
    <button class="star ${wish.has(s.id) ? "on" : ""}" data-star="${s.id}" title="Bekleme listesi">${wish.has(s.id) ? "★" : "☆"}</button>
    <div class="img">${s.icon ? `<img loading="lazy" src="${esc(s.icon)}" alt="">` : ""}</div>
    <div class="body">
      <div class="name">${esc(s.name)}</div>
      <div class="meta">${esc(s.weapon)}${t ? ` · <span class="tier"></span>${esc(t.name.replace(" Edition", ""))}` : ""}</div>
      ${extra}
      ${price != null ? `<div class="price">${old ? `<s>${old} VP</s>` : ""}${price} VP</div>` : ""}
    </div></div>`;
}

function todayView() {
  const rec = history[history.length - 1];
  if (!rec) return '<div class="empty">Henüz kayıtlı pazar yok. Workflow ilk kez çalışınca burada görünecek.</div>';
  const items = rec.daily.items;
  const hits = items.filter((x) => wish.has(byAny.get(x.offer)?.id));
  let h = "";
  if (hits.length) h += `<div class="banner">⭐ Bekleme listendeki skin pazarda: <b>${hits.map((x) => esc(byAny.get(x.offer).name)).join(", ")}</b></div>`;
  h += `<h2>Günlük pazar · ${fmtDate(rec.date)} · yenilenmeye <span class="timer" ${endAttr(rec, rec.daily.ends_in)}></span></h2>`;
  h += `<div class="grid">${items.map((x) => card(byAny.get(x.offer), { price: x.price }, x.offer)).join("")}</div>`;
  for (const b of rec.bundles) {
    const meta = catalog.bundles[b.id] || {};
    h += `<h2>Vitrin seti · <span class="timer" ${endAttr(rec, b.ends_in || 0)}></span></h2><div class="bundle">
      ${meta.image ? `<img src="${esc(meta.image)}" alt="">` : ""}
      <div><div class="name">${esc(meta.name || "Vitrin seti")}</div>
      <div class="price">${b.discounted && b.price !== b.discounted ? `<s>${b.price} VP</s>` : ""}${b.discounted || b.price || "?"} VP${b.percent ? ` · -%${b.percent}` : ""}</div>
      <ul>${b.skins.map((id) => { const s = byAny.get(id); return `<li>${wish.has(s?.id) ? "⭐ " : ""}${esc(s ? s.name : "Bilinmeyen")}</li>`; }).join("")}${b.other_items ? `<li>+ ${b.other_items} diğer öğe</li>` : ""}</ul></div></div>`;
  }
  if (rec.night_market?.items?.length) {
    h += `<h2>Night Market · <span class="timer" ${endAttr(rec, rec.night_market.ends_in || 0)}></span></h2><div class="grid">${rec.night_market.items.map((x) => card(byAny.get(x.offer), { price: x.discounted, old: x.price, extra: `<div class="meta">-%${x.percent}</div>` }, x.offer)).join("")}</div>`;
  }
  setTimeout(tick);
  return h;
}

function historyView() {
  if (!history.length) return '<div class="empty">Geçmiş henüz boş.</div>';
  return [...history].reverse().map((rec) => `<div class="day"><h3>${fmtDate(rec.date)}</h3><div class="grid small">${
    rec.daily.items.map((x) => card(byAny.get(x.offer), { price: x.price }, x.offer)).join("")}</div></div>`).join("");
}

function skinsView() {
  const weapons = [...new Set(catalog.skins.map((s) => s.weapon))].sort();
  const tiers = Object.entries(catalog.tiers).sort((a, b) => a[1].rank - b[1].rank);
  const q = filters.q.toLowerCase();
  const list = catalog.skins.filter((s) =>
    (!q || s.name.toLowerCase().includes(q) || (s.theme || "").toLowerCase().includes(q)) &&
    (!filters.weapon || s.weapon === filters.weapon) && (!filters.tier || s.tier === filters.tier) &&
    (!filters.onlyWish || wish.has(s.id)));
  return `<div class="filters">
    <input type="search" id="q" placeholder="Skin veya koleksiyon ara…" value="${esc(filters.q)}">
    <select id="fw"><option value="">Tüm silahlar</option>${weapons.map((w) => `<option ${w === filters.weapon ? "selected" : ""}>${esc(w)}</option>`).join("")}</select>
    <select id="ft"><option value="">Tüm seviyeler</option>${tiers.map(([id, t]) => `<option value="${id}" ${id === filters.tier ? "selected" : ""}>${esc(t.name.replace(" Edition", ""))}</option>`).join("")}</select>
    <label class="note" style="align-self:center"><input type="checkbox" id="fo" ${filters.onlyWish ? "checked" : ""}> sadece ⭐</label></div>
    <div class="note" style="margin-bottom:10px">${list.length} skin</div>
    <div class="grid small">${list.slice(0, shown).map((s) => card(s, {})).join("")}</div>
    ${list.length > shown ? `<div class="row" style="justify-content:center"><button class="btn ghost" id="more">Daha fazla göster</button></div>` : ""}`;
}

function wishView() {
  const dirty = wish.size !== wishSaved.length || [...wish].some((id) => !wishSaved.includes(id));
  const list = [...wish].map((id) => byAny.get(id)).filter(Boolean);
  const auto = autoRepo();
  return `<h2>Bekleme listem (${list.length})</h2>
    ${list.length ? `<div class="grid small">${list.map((s) => card(s, {})).join("")}</div>` : '<div class="empty">Boş. "Tüm skinler" sekmesinde ☆ simgesine dokunarak skin ekle.</div>'}
    <div class="row"><button class="btn" id="save" ${dirty ? "" : "disabled"}>${dirty ? "GitHub'a kaydet" : "Kayıtlı"}</button>
      <span class="note">${dirty ? "Değişiklikler henüz botun okuduğu listeye yazılmadı." : "Bot bu listeye göre bildirim gönderir."}</span></div>
    ${isLocal ? "" : isGithub ? `<div class="box"><b>Kaydetme ayarı</b>
      <div class="note">Listeyi buradan kaydedebilmek için sadece bu repoya <i>Contents: Read and write</i> izni olan bir GitHub token'ı gerekir. Token yalnızca bu tarayıcıda saklanır.</div>
      <label>Repo (kullanıcı/repo)</label><input id="repo" value="${esc(ls.get("repo", auto))}" placeholder="kullanici/valorant-pazar">
      <label>GitHub token</label><input id="token" type="password" value="${esc(ls.get("token"))}" placeholder="github_pat_…">
      <div class="row"><button class="btn ghost" id="saveset">Ayarı sakla</button></div></div>` : `<div class="box"><b>Kaydetme ayarı</b>
      <div class="note">config.env dosyasındaki PANEL_TOKEN değerini gir. Yalnızca bu tarayıcıda saklanır.</div>
      <label>Panel şifresi</label><input id="token" type="password" value="${esc(ls.get("token"))}">
      <div class="row"><button class="btn ghost" id="saveset">Ayarı sakla</button></div></div>`}`;
}

function autoRepo() {
  const m = location.hostname.match(/^(.+)\.github\.io$/);
  const repo = location.pathname.split("/")[1];
  return m && repo ? `${m[1]}/${repo}` : "";
}

function render() {
  $("#main").innerHTML = { today: todayView, history: historyView, skins: skinsView, wish: wishView }[tab]();
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 3000);
}

const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
const isGithub = /\.github\.io$/.test(location.hostname);

async function saveWishlist() {
  if (!isGithub) {  // yerel panel ya da sunucu: kayıt kendi API'sine gider
    try {
      const r = await fetch("/api/wishlist", { method: "POST", headers: { "X-Panel-Token": ls.get("token") }, body: JSON.stringify({ skins: [...wish] }) });
      if (r.status === 403) throw new Error("panel şifresi yanlış ya da girilmemiş");
      if (!r.ok) throw new Error(r.status);
      wishSaved = [...wish];
      toast("Kaydedildi ✓");
    } catch (e) { toast("Kaydedilemedi: " + e.message); }
    return render();
  }
  const repo = ls.get("repo", autoRepo()), token = ls.get("token");
  if (!repo || !token) return toast("Önce repo ve token ayarını gir.");
  const url = `https://api.github.com/repos/${repo}/contents/docs/data/wishlist.json`;
  const headers = { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" };
  $("#save").disabled = true;
  try {
    const cur = await fetch(url, { headers });
    const sha = cur.ok ? (await cur.json()).sha : undefined;
    const body = { message: "Bekleme listesi güncellendi", sha, content: btoa(JSON.stringify({ skins: [...wish] }, null, 1)) };
    const r = await fetch(url, { method: "PUT", headers, body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.json()).message || r.status);
    wishSaved = [...wish];
    toast("Kaydedildi ✓");
  } catch (e) { toast("Kaydedilemedi: " + e.message); }
  render();
}

document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.dataset.star) {
    wish.has(t.dataset.star) ? wish.delete(t.dataset.star) : wish.add(t.dataset.star);
    const y = scrollY; render(); scrollTo(0, y);
  } else if (t.id === "more") { shown += 60; render(); }
  else if (t.id === "save") saveWishlist();
  else if (t.id === "saveset") { if ($("#repo")) ls.set("repo", $("#repo").value.trim()); ls.set("token", $("#token").value.trim()); toast("Ayar saklandı"); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { filters.q = e.target.value; shown = 60; const p = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(p, p); }
});
document.addEventListener("change", (e) => {
  const m = { fw: "weapon", ft: "tier" }[e.target.id];
  if (m) { filters[m] = e.target.value; shown = 60; render(); }
  else if (e.target.id === "fo") { filters.onlyWish = e.target.checked; shown = 60; render(); }
});

init();
</script>
</body>
</html>
