name: Tanıtım videosu görselleri

# Geçici: yalnızca promo-assets dalına itilince çalışır, indirdiklerini aynı dala commit eder.
on:
  push:
    branches: [promo-assets]
    paths: [urls.txt, videos.txt, fetch.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install requests pillow
      - run: python fetch.py
      - name: Kaydet
        run: |
          git config user.name "pazar-bot"
          git config user.email "pazar-bot@users.noreply.github.com"
          git add assets
          git commit -m "Tanıtım videosu görselleri"
          git push
