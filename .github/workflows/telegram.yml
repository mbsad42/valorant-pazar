name: Telegram komutları

on:
  schedule:
    - cron: "*/5 * * * *"   # her 5 dakikada bir yeni mesaj var mı diye bakar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Komutları işle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m valstore.telegram_bot
      - name: Değişiklikleri kaydet
        if: always()
        run: |
          git config user.name "pazar-bot"
          git config user.email "pazar-bot@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then echo "Değişiklik yok"; else
            git commit -m "Telegram: bekleme listesi güncellendi"
            for i in 1 2 3; do
              git pull --rebase -q || true
              git push && break
              sleep 5
            done
          fi
